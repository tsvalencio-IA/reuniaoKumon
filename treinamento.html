<!doctype html>
<html lang="pt-BR">
<head>

<title>Treinamento de Equipe • Kumon • V2</title>

<style>
:root{--b:#00AEEF;--o:#F39200;--bg:#06101d;--bg2:#0b1d30;--card:#10273f;--line:#24435e;--txt:#f7fbff;--mut:#9eb2c6;--green:#39d483;--red:#ff6b7c;--shadow:0 22px 60px #0007}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0,#163b57 0,#07121f 38%,#040a11 100%);color:var(--txt);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}.hidden{display:none!important}.shell{width:min(1180px,100%);margin:auto;padding:max(14px,env(safe-area-inset-top)) clamp(12px,2.5vw,28px) max(18px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--b),#0674ad);display:grid;place-items:center;font:900 25px Nunito;box-shadow:0 12px 28px #00aeef38}.brand b{display:block;font:900 18px Nunito}.brand span{display:block;color:var(--mut);font-size:11px}.status{font-size:11px;font-weight:900;padding:8px 11px;border:1px solid #603141;background:#351522;color:#ff9bab;border-radius:999px}.status.ok{border-color:#286c4b;background:#103524;color:#7ff0b4}.panel,.card{background:linear-gradient(145deg,#112a43,#091827);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px}.card{padding:18px;border-radius:19px}.hero{padding:clamp(28px,6vw,66px);text-align:center}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.17em;color:#70d8ff}.hero h1,.slide h2{font-family:Nunito;margin:10px 0 16px;font-weight:900;line-height:.98}.hero h1{font-size:clamp(38px,7vw,76px)}.hero p{max-width:850px;margin:auto;color:#bfd0df;font-size:clamp(15px,2vw,21px);line-height:1.6}.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:24px}.mode{min-height:150px;padding:20px;border:1px solid var(--line);border-radius:21px;background:#0c2238;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;transition:.15s}.mode:hover{transform:translateY(-2px);border-color:#3f7199}.mode i{font-size:30px;color:#72d9ff}.mode b{font:900 17px Nunito}.mode span{font-size:11px;color:var(--mut)}.footer{text-align:center;color:#70859a;font-size:10px;padding:28px 0 6px}.btn{border:1px solid #315573;background:#102a44;color:#fff;border-radius:14px;min-height:48px;padding:11px 15px;font-weight:800;cursor:pointer}.btn:active{transform:scale(.985)}.btn.primary{border:0;background:linear-gradient(135deg,var(--b),#0575ad)}.btn.orange{border:0;background:linear-gradient(135deg,var(--o),#b96800)}.btn.green{border:0;background:linear-gradient(135deg,#2abf73,#167a49)}.btn.danger{background:#371622;border-color:#743249;color:#ffb0ba}.btn.block{width:100%}.btn.big{min-height:72px;font-size:18px}.input{width:100%;padding:14px;border-radius:13px;border:1px solid #315473;background:#061522;color:#fff;outline:none}.input:focus{border-color:var(--b);box-shadow:0 0 0 3px #00aeef24}.label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#c9d9e7}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.muted{color:var(--mut)}.tiny{font-size:11px}.notice{padding:13px 15px;border-radius:14px;border:1px solid #2d506c;background:#0a2034;color:#cfe1ee}.notice.warn{border-color:#72531d;background:#2c210d;color:#ffd494}.notice.good{border-color:#286747;background:#0e3020;color:#b7f1d2}
/* APRESENTAÇÃO */
.presentation{min-height:100dvh;display:grid;grid-template-rows:auto 4px 1fr auto}.phead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;background:#07121eea;border-bottom:1px solid #183550;backdrop-filter:blur(12px)}.phead .left{display:flex;align-items:center;gap:11px}.slideIcon{width:43px;height:43px;border-radius:13px;background:#0d2b45;color:#73daff;display:grid;place-items:center}.phead h1{font:900 clamp(16px,2.2vw,23px) Nunito;margin:0}.phead small{display:block;color:var(--mut)}.progress{background:#10273d}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--o));transition:.2s}.stage{padding:clamp(12px,2.7vw,34px);display:grid}.slide{min-height:calc(100dvh - 142px);border:1px solid #1d3c58;border-radius:29px;background:radial-gradient(circle at 92% 7%,#16415f 0,transparent 34%),linear-gradient(145deg,#0d2237,#071421);box-shadow:var(--shadow);padding:clamp(24px,5vw,68px);display:flex;flex-direction:column;justify-content:center;overflow:auto}.slide h2{font-size:clamp(34px,5.4vw,70px);max-width:1080px}.lead{max-width:990px;color:#cad9e5;font-size:clamp(17px,2vw,25px);line-height:1.55}.slide ul{font-size:clamp(16px,1.75vw,23px);line-height:1.5;padding-left:1.2em;margin:10px 0}.slide li+li{margin-top:7px}.note{margin-top:17px;padding:14px 17px;border-left:4px solid var(--o);border-radius:0 14px 14px 0;background:#2a1d0b;color:#ffd89d;font-weight:700}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:19px}.step{padding:13px 15px;border:1px solid #2c577b;border-radius:14px;background:#102c46;font-weight:900}.arrow{color:var(--o);font-size:20px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}.col{background:#091b2d;border:1px solid #22435f;border-radius:18px;padding:18px}.col h3{margin:0 0 9px;color:#73dcff;font:900 17px Nunito}.col ul{font-size:clamp(14px,1.4vw,18px)}.qprompt{font:900 clamp(22px,3vw,38px)/1.22 Nunito;max-width:1050px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:20px}.answer{position:relative;overflow:hidden;border:1px solid #2b4e6b;border-radius:17px;background:#0a1d30;padding:15px 17px;font-size:clamp(14px,1.45vw,19px);font-weight:700}.answer.correct{border-color:#2eaa6d;background:#0b2f20}.answer .pct{float:right;color:#78dbff}.answer .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--b)}.explain{margin-top:16px;padding:15px;border:1px solid #296e4d;background:#0b3020;color:#c0f4d8;border-radius:17px}.tip{padding:clamp(22px,4vw,42px);border:1px solid #724814;background:linear-gradient(145deg,#38230b,#17140e);border-radius:25px}.tip.blue{border-color:#2a5f94;background:linear-gradient(145deg,#0e2d4e,#091725)}.tip h3{font:900 clamp(29px,4vw,51px) Nunito;margin:8px 0}.tip p{font-size:clamp(17px,2vw,24px);line-height:1.58}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#f3920024;color:#ffc36c;font-weight:900}.tip.blue .badge{background:#3477bd30;color:#8fc9ff}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.checkgroup{background:#091b2d;border:1px solid #23435e;border-radius:16px;padding:14px}.checkgroup h3{margin:0 0 8px;color:#75dcff}.checkitem{display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:#c9d8e4}.checkitem i{color:var(--green);margin-top:4px}.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 13px;border-top:1px solid #183550;background:#07121f}.round{width:43px;height:43px;border-radius:50%;border:1px solid #2e4d68;background:#0c2236;color:#fff}.sig{font-size:9px;color:#6e8396;text-align:right}
/* CONTROLE */
.controlLayout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:15px}.now{padding:21px}.now h1{font:900 clamp(28px,4vw,45px) Nunito;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.stat{padding:12px;border:1px solid #20415e;border-radius:14px;background:#071827;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:10px;color:var(--mut)}.slideList{max-height:72dvh;overflow:auto;padding:7px}.slideList button{width:100%;border:0;border-bottom:1px solid #1c344a;background:transparent;color:#c9d8e4;text-align:left;padding:11px 12px}.slideList button.active{background:#0c3855;border-left:4px solid var(--b);font-weight:900;color:#fff}
/* PARTICIPANTE */
.join{width:min(620px,100%);margin:5vh auto;padding:22px}.join h1{font:900 35px Nunito;margin:5px 0}.participantOptions{display:grid;gap:10px;margin-top:15px}.participantOptions button{min-height:62px;text-align:left}.participantOptions button.selected{border-color:var(--o);background:#33230d;color:#ffd496}.waiting{text-align:center;padding:35px}.waiting i{font-size:45px;color:#6fd8ff;margin-bottom:12px}
/* ADMIN */
.adminLayout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:15px}.adminSide,.adminMain{padding:16px}.adminSlides{display:grid;gap:7px;max-height:62dvh;overflow:auto}.adminSlides button{border:1px solid #25445f;background:#091b2b;color:#d8e6f1;text-align:left;padding:10px;border-radius:12px}.adminSlides button.active{border-color:var(--b);background:#0d3550}.editor{display:grid;grid-template-columns:1fr 1fr;gap:11px}.editor .wide{grid-column:1/-1}.loginOverlay{position:fixed;inset:0;z-index:99;background:#06101df5;display:grid;place-items:center;padding:18px}.loginCard{width:min(390px,100%);padding:24px;text-align:center}.loginCard i{font-size:39px;color:#72d9ff}.loginCard h2{font:900 27px Nunito;margin:10px 0 4px}
.toast{position:fixed;right:16px;bottom:16px;z-index:120;max-width:360px;padding:13px 15px;border:1px solid #2f5879;background:#102b45;border-radius:14px;box-shadow:var(--shadow)}
@media(max-width:900px){.modes{grid-template-columns:repeat(2,1fr)}.grid.two,.grid.three,.controlLayout,.adminLayout{grid-template-columns:1fr}.cols,.answers{grid-template-columns:1fr}.checks{grid-template-columns:repeat(2,1fr)}.adminSide{order:2}.adminMain{order:1}}
@media(max-width:560px){.shell{padding:11px}.brand span{display:none}.hero{padding:28px 18px}.modes{gap:9px}.mode{min-height:122px;padding:13px}.slide{border-radius:20px;padding:21px;min-height:calc(100dvh - 128px)}.phead{padding:9px 10px}.phead small{display:none}.pfoot{padding:7px 9px}.sig{display:none}.checks{grid-template-columns:1fr}.editor{grid-template-columns:1fr}.editor .wide{grid-column:auto}}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
// KUMON TREINAMENTO V3 — nomes de dicas editáveis + placar individual + resumo anônimo final.
const BASE='kumon_config/treinamento';
const ADMIN_PIN='*177';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const mode=new URLSearchParams(location.search).get('modo')||'inicio';
let db=null,slides=[],activeCode='',session=null,current=0,reveal=false,participantId='',participantName='',permissionIssue=false;
const DEFAULT_SLIDES=[
{id:'abertura',type:'cover',icon:'fa-people-group',kicker:'TREINAMENTO DE EQUIPE',title:'Organização que facilita o trabalho',subtitle:'Rotina do aluno • autonomia • registros • metas • comunicação • equipe',body:'Organização não é fazer tudo mais rápido. É criar uma rotina em que cada pessoa saiba o que fazer, por que fazer e qual é o próximo passo.'},
{id:'objetivos',type:'content',icon:'fa-bullseye',kicker:'POR QUE ESTE TREINAMENTO EXISTE?',title:'O que queremos melhorar juntos',bullets:['Tornar a rotina mais funcional e previsível.','Reduzir retrabalho e acúmulo de tarefas.','Facilitar o acompanhamento dos alunos.','Desenvolver cada vez mais a autonomia dos alunos.','Melhorar a comunicação entre a equipe e com os pais.','Encontrar formas de organização que funcionem dentro do método.']},
{id:'q-dia-aluno',type:'question',icon:'fa-circle-question',kicker:'INTERAÇÃO 01',title:'Qual deve ser a primeira pergunta do auxiliar?',prompt:'Ao olhar para um aluno que acabou de chegar, qual pensamento organiza melhor o atendimento?',options:['Como eu consigo dar conta de tudo hoje?','O que precisa acontecer com esse aluno hoje?','Qual tarefa eu consigo terminar mais rápido?','O que posso deixar para registrar depois?'],correct:1,explanation:'A referência do material é visualizar o que precisa acontecer com o aluno hoje. A organização serve para acompanhar o aluno, e não apenas para dar conta dos papéis.'},
{id:'fluxo-aluno',type:'flow',icon:'fa-route',kicker:'ROTINA DO ALUNO',title:'Visualize o fluxo antes de começar',items:['Chegada','Tarefa','Correção','Aula anterior','Bloco do dia','Correção','Registro','Próximo passo'],body:'Uma rotina organizada permite saber onde o aluno está, o que já fez e qual é o próximo passo.'},
{id:'boletim',type:'content',icon:'fa-clipboard-check',kicker:'BOLETIM',title:'Organizar para enxergar o aluno',bullets:['Fez a tarefa? Fez completa?','Onde teve dificuldade e por quê?','O que precisa ser corrigido?','O que já consegue fazer sozinho?','O que precisa ser retomado?','Qual será o próximo passo?'],note:'Regra prática: não acumular informação para olhar depois.'},
{id:'q-autonomia',type:'question',icon:'fa-lightbulb',kicker:'INTERAÇÃO 02',title:'O aluno diz: “Não sei fazer.”',prompt:'Qual resposta está mais alinhada com o treinamento?',options:['Dar a resposta para ele conseguir continuar.','Fazer a primeira parte por ele e pedir que copie o raciocínio.','Conduzir com perguntas, exemplo e referência para que ele pense e confira.','Mandar pular a questão e voltar depois.'],correct:2,explanation:'A orientação é não entregar a resposta pronta. O auxiliar indica caminhos, usa exemplos e ajuda o aluno a conferir e buscar referências.'},
{id:'dica-dani-1',type:'tip',icon:'fa-comment-dots',kicker:'DICA PRÁTICA DA EQUIPE',title:'Rotina e boletim',author:'',staffColor:'orange',body:'Conferir se a tarefa está completa desde o nome; fazer a correção da tarefa e da aula anterior; organizar o bloco de classe do dia; ensinar o aluno a pegar o próprio boletim e ganhar autonomia; anotar horário de chegada e saída.'},
{id:'uma-materia',type:'content',icon:'fa-layer-group',kicker:'ORGANIZAÇÃO PRÁTICA',title:'Uma matéria por vez',body:'Evite colocar tudo junto na mesa quando o aluno já consegue trabalhar com autonomia.',bullets:['Matemática → corrigir → finalizar → registrar → guardar.','Depois Português → corrigir → finalizar → registrar → guardar.','Começou uma coisa? Termine o máximo possível antes de iniciar outra.','Desmembrar ajuda o aluno a entender o processo e facilita o avanço.']},
{id:'materias',type:'content',icon:'fa-book-open',kicker:'ACOMPANHAMENTO',title:'Cada matéria pede um olhar',bullets:['Matemática: verificar domínio do conteúdo antes do bloco; o material cita tabela de + e – relacionada ao assunto.','Português: checagem da leitura, cronômetro e observação do desempenho.','Inglês: checagem oral da tarefa, escuta do áudio e checagem do bloco.','Essas práticas ajudam a observar nível, habilidades e necessidades do aluno.']},
{id:'visualizacao',type:'flow',icon:'fa-eye',kicker:'TÉCNICA DA EQUIPE',title:'Visualizar o dia e como faz',items:['Ele chega','Pega o boletim','Entrega a tarefa','Correção','Atividade necessária','Bloco','Correção','Registro','Próximo passo'],body:'Antecipar mentalmente o fluxo reduz improvisos e ajuda a perceber o que precisará estar pronto.'},
{id:'trabalho-invisivel',type:'content',icon:'fa-gears',kicker:'TRABALHO ADMINISTRATIVO',title:'O trabalho que sustenta o atendimento',bullets:['Atualizar boletins e presença.','Programar e registrar notas.','Fazer relatórios e acompanhar metas.','Organizar calendários.','Conferir blocos e fechar informações.'],note:'Aquilo que não aparece para o aluno também faz parte da experiência dele.'},
{id:'q-retrabalho',type:'question',icon:'fa-rotate-left',kicker:'INTERAÇÃO 03',title:'Como reduzir retrabalho?',prompt:'O bloco já está corrigido. Qual sequência evita abrir o mesmo material várias vezes?',options:['Guardar → depois passar nota → depois procurar o boletim → depois relatório.','Passar nota → fechar no boletim → colocar no relatório.','Fazer o relatório primeiro e voltar ao boletim no fim do dia.','Esperar juntar vários alunos para registrar tudo de uma vez.'],correct:1,explanation:'O próprio material propõe aproveitar uma sequência contínua: bloco corrigido → passar nota → fechar no boletim → colocar no relatório.'},
{id:'programacao',type:'content',icon:'fa-calendar-check',kicker:'PROGRAMAÇÃO E METAS',title:'A organização precisa de um momento de conferência',bullets:['Programação acompanhada continuamente.','Atualizar o real → contar os dias → fazer a meta → registrar → acompanhar.','Usar o calendário como referência.','Sugestão do material: quarta-feira como momento de olhar calendário, real, programação e pendências.']},
{id:'comunicacao',type:'content',icon:'fa-comments',kicker:'COMUNICAÇÃO COM OS PAIS',title:'Responder é também acompanhar',bullets:['Acompanhar o celular do Kumon com frequência.','Saber sobre faltas, horários, ajustes e metas.','Criar vínculo e demonstrar presença.','Antes de responder: entender a pergunta, conferir a informação e registrar o que for importante.','Quando não souber, confirmar antes de improvisar.']},
{id:'q-pais',type:'question',icon:'fa-message',kicker:'INTERAÇÃO 04',title:'Você não tem certeza da resposta para um pai.',prompt:'Qual conduta evita informação desencontrada?',options:['Responder alguma coisa rápido para não deixar sem retorno.','Ignorar até descobrir sozinho.','Dizer que vai verificar a informação e retornar, e realmente acompanhar.','Encaminhar sempre para outra pessoa sem analisar.'],correct:2,explanation:'Rapidez não substitui precisão. O treinamento recomenda verificar a informação quando houver dúvida e manter o vínculo com a família.'},
{id:'dica-charles',type:'tip',icon:'fa-comment-dots',kicker:'DICA PRÁTICA DA EQUIPE',title:'Olhar metódico',author:'',staffColor:'blue',body:'Quarta-feira com olhar específico; pasta dos fechamentos mensais e lembretes; caderno de controle do dia a dia; gráfico real para domínio da futura programação; fechamento de relatório; estudo da folha de programação do material e registro das metas de estudo.'},
{id:'q-caos',type:'question',icon:'fa-shuffle',kicker:'INTERAÇÃO 05 — SITUAÇÃO REAL',title:'A unidade ficou caótica. E agora?',prompt:'Há aluno atrasado, tarefa esquecida, mensagem de pai, correção esperando e boletim pendente. Qual princípio ajuda a retomar o controle?',options:['Começar tudo ao mesmo tempo para ninguém esperar.','Parar, observar, escolher a prioridade, fazer, finalizar e retomar.','Responder primeiro tudo que chegar no celular.','Deixar registros para outro dia e focar apenas no que aparece.'],correct:1,explanation:'O material resume esse raciocínio como aprender a se organizar na bagunça dos outros: não controlar os imprevistos, mas controlar como respondemos a eles.'},
{id:'chego-vou',type:'content',icon:'fa-door-open',kicker:'RITUAL DIÁRIO',title:'Como eu chego e como eu vou embora?',columns:[{title:'AO CHEGAR',items:['Quem vem?','Quem está faltando?','Quais pendências existem?','Quem precisa de atenção especial?','O que precisa estar preparado?']},{title:'ANTES DE IR EMBORA',items:['Boletins e materiais encaminhados','Registros e mensagens conferidos','Pendências identificadas','Mesa organizada','Informações compartilhadas com a equipe']}]},
{id:'responsabilidades',type:'content',icon:'fa-people-arrows',kicker:'EQUIPE',title:'Responsabilidade individual e coletiva',columns:[{title:'MINHA RESPONSABILIDADE',items:['meu boletim','meus registros','meus horários','minhas pendências','minha comunicação','meu espaço','meu acompanhamento do aluno']},{title:'RESPONSABILIDADE COLETIVA',items:['fluxo da unidade','comunicação entre equipe','informações importantes','apoio quando necessário','organização do ambiente','experiência do aluno e da família']}],note:'Uma equipe organizada sabe quando pedir ajuda, quando oferecer e como não deixar uma pendência desaparecer.'},
{id:'checklist',type:'checklist',icon:'fa-list-check',kicker:'CHECKLIST FINAL',title:'Meu dia está organizado?',groups:[{title:'ALUNOS',items:['Sei quais alunos virão hoje.','Sei quais são as pendências.','Boletins estão organizados.','Sei o que cada aluno precisa fazer.','Estou estimulando autonomia.']},{title:'MATERIAIS',items:['Tarefas corrigidas.','Blocos corrigidos.','Notas registradas.','Materiais organizados.']},{title:'ADMINISTRATIVO',items:['Presença atualizada.','Boletins atualizados.','Programação acompanhada.','Metas verificadas.','Relatórios encaminhados.']},{title:'COMUNICAÇÃO',items:['Celular do Kumon acompanhado.','Pais respondidos.','Faltas acompanhadas.','Informações importantes registradas.']},{title:'FINAL DO DIA',items:['Pendências identificadas.','Amanhã está minimamente preparado.','Mesa organizada.','Informações importantes compartilhadas com a equipe.']}]},
{id:'encerramento',type:'closing',icon:'fa-graduation-cap',kicker:'TREINAMENTO CONCLUÍDO',title:'Organizar é conseguir acompanhar melhor.',body:'O objetivo não é criar rigidez. É fazer com que a rotina continue funcionando mesmo quando o dia sai do planejado.',note:'Powered by thIAguinho Soluções Digitais'}
];
function toast(msg,bad=false){const t=$('#toast');t.textContent=msg;t.style.borderColor=bad?'#7a3044':'#2f5879';t.classList.remove('hidden');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.add('hidden'),3200)}
function appInit(){if(db)return db;if(!window.KUMON_FIREBASE_CONFIG)throw new Error('firebase-config.js não foi encontrado. Este arquivo deve ficar na raiz do mesmo repositório da reunião.');try{firebase.app()}catch(e){firebase.initializeApp(window.KUMON_FIREBASE_CONFIG)}db=firebase.database();return db}

function normalise(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return Object.keys(v).sort((a,b)=>Number(a)-Number(b)).map(k=>v[k]).filter(Boolean)}
function cleanStaffNames(list){let changed=false;const out=(list||[]).map(item=>{const s={...item};if(s.id==='dica-dani-1'){if(s.author){s.author='';changed=true}if(/^Dani\s*[—-]\s*/i.test(s.title||'')){s.title=String(s.title).replace(/^Dani\s*[—-]\s*/i,'');changed=true}}if(s.id==='dica-charles'){if(s.author){s.author='';changed=true}if(/^Charles\s*[—-]\s*/i.test(s.title||'')){s.title=String(s.title).replace(/^Charles\s*[—-]\s*/i,'');changed=true}}return s});return {slides:out,changed}}
async function getSlides(){appInit();try{const s=await db.ref(BASE+'/content/slides').once('value');const got=normalise(s.val());if(got.length){const cleaned=cleanStaffNames(got);if(cleaned.changed){try{await db.ref(BASE+'/content').update({slides:cleaned.slides,updatedAt:firebase.database.ServerValue.TIMESTAMP})}catch(e){console.warn('Não foi possível persistir a retirada dos nomes, mas a exibição já foi corrigida.',e)}}return cleaned.slides}try{await db.ref(BASE+'/content').update({slides:DEFAULT_SLIDES,version:1,seededAt:firebase.database.ServerValue.TIMESTAMP})}catch(e){console.warn(e)}return DEFAULT_SLIDES}catch(e){console.warn(e);return DEFAULT_SLIDES}}
async function participantScore(code,pid){let right=0,wrong=0,total=0;if(!code||!pid)return {right,wrong,total};const snap=await sessionRef(code).child('answers').once('value');const all=snap.val()||{};(slides||[]).filter(s=>s.type==='question').forEach(q=>{const a=all[q.id]&&all[q.id][pid];if(!a)return;total++;if(Number(a.option)===Number(q.correct))right++;else wrong++});return {right,wrong,total}}
async function anonymousTeamScore(code){let right=0,wrong=0,total=0;if(!code)return {right,wrong,total};const snap=await sessionRef(code).child('answers').once('value');const all=snap.val()||{};(slides||[]).filter(s=>s.type==='question').forEach(q=>{Object.values(all[q.id]||{}).forEach(a=>{if(!a||a.option===undefined||a.option===null)return;total++;if(Number(a.option)===Number(q.correct))right++;else wrong++})});return {right,wrong,total}}

function slideInner(s,answersData={}){const kicker=`<div class="eyebrow">${esc(s.kicker||'TREINAMENTO')}</div>`;const title=`<h2>${esc(s.title||'')}</h2>`;if(s.type==='cover'||s.type==='closing')return `${kicker}${title}${s.subtitle?`<div class="lead"><b>${esc(s.subtitle)}</b></div>`:''}${s.body?`<p class="lead">${esc(s.body)}</p>`:''}${s.note?`<div class="note">${esc(s.note)}</div>`:''}`;if(s.type==='tip')return `${kicker}<div class="tip ${s.staffColor==='blue'?'blue':''}"><span class="badge"><i class="fa-solid fa-comment-dots"></i>&nbsp; DICA DA EQUIPE${s.author?' • '+esc(s.author):''}</span><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div>`;if(s.type==='flow')return `${kicker}${title}${s.body?`<p class="lead">${esc(s.body)}</p>`:''}<div class="flow">${(s.items||[]).map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="step">${esc(x)}</span>`).join('')}</div>`;if(s.type==='question'){const vals=Object.values(answersData||{});const total=vals.length;return `${kicker}${title}<div class="qprompt">${esc(s.prompt)}</div><div class="answers">${(s.options||[]).map((x,i)=>{const n=vals.filter(v=>Number(v.option)===i).length,p=total?Math.round(n*100/total):0,c=reveal&&i===Number(s.correct);return `<div class="answer ${c?'correct':''}"><span>${String.fromCharCode(65+i)}) ${esc(x)}</span>${reveal?`<span class="pct">${p}%</span><i class="bar" style="width:${p}%"></i>`:''}</div>`}).join('')}</div>${reveal?`<div class="explain"><b>Resposta comentada:</b> ${esc(s.explanation||'')}</div>`:`<div class="note">Aguardando respostas da equipe${total?' • '+total+' recebida'+(total===1?'':'s'):''}.</div>`}`}
if(s.type==='checklist')return `${kicker}${title}<div class="checks">${(s.groups||[]).map(g=>`<div class="checkgroup"><h3>${esc(g.title)}</h3>${(g.items||[]).map(x=>`<div class="checkitem"><i class="fa-solid fa-square-check"></i><span>${esc(x)}</span></div>`).join('')}</div>`).join('')}</div>`;let out=`${kicker}${title}`;if(s.body)out+=`<p class="lead">${esc(s.body)}</p>`;if(s.bullets)out+=`<ul>${s.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if(s.columns)out+=`<div class="cols">${s.columns.map(c=>`<div class="col"><h3>${esc(c.title)}</h3><ul>${(c.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;if(s.note)out+=`<div class="note">${esc(s.note)}</div>`;return out}

,i)=>`<button class="btn ${val&&Number(val.option)===i?'selected':''}" data-opt="${i}" ${reveal?'disabled':''}>${String.fromCharCode(65+i)}) ${esc(x)}</button>`).join('')}</div>${reveal?`${personal}<div class="explain"><b>Resposta comentada:</b> ${esc(s.explanation)}</div>`:`<div class="notice" style="margin-top:12px">${val?'Resposta registrada. Você pode alterar enquanto o resultado não for revelado.':'Escolha uma alternativa.'}</div>`}`;area.querySelectorAll('[data-opt]').forEach(b=>b.onclick=async()=>{if(reveal)return;await sessionRef(activeCode).child('answers/'+s.id+'/'+participantId).set({name:participantName,option:Number(b.dataset.opt),ts:firebase.database.ServerValue.TIMESTAMP});renderParticipant()})}
function adminLogin(){return `<div id="login" class="loginOverlay"><form id="adminLogin" class="panel loginCard"><i class="fa-solid fa-user-shield"></i><h2>Administração</h2><p class="muted">Treinamento de Equipe</p><input id="pin" class="input" type="password" placeholder="PIN do gestor" required><button class="btn primary block" style="margin-top:10px">ENTRAR</button></form></div>`}
function adminHtml(){return `<main class="shell">${baseTop('Administração do Treinamento','Sessões • conteúdo • resultados','aStatus')}<div class="grid two" style="margin-bottom:14px"><section class="card"><div class="eyebrow">SESSÃO AO VIVO</div><h2 style="margin:7px 0;font:900 28px Nunito" id="aSession">Nenhuma sessão ativa</h2><div class="toolbar"><button id="newSession" class="btn green"><i class="fa-solid fa-plus"></i> NOVA SESSÃO</button><button id="endSession" class="btn danger">ENCERRAR</button></div><div class="grid three" style="margin-top:12px"><div class="stat"><b id="aPeople">0</b><span>PARTICIPANTES</span></div><div class="stat"><b id="aSlide">—</b><span>SLIDE</span></div><div class="stat"><b id="aAns">0</b><span>RESPOSTAS</span></div></div><div class="toolbar" style="margin-top:12px"><a class="btn" href="?modo=apresentacao" target="_blank">TELÃO</a><a class="btn" href="?modo=controle" target="_blank">CONTROLE</a><a class="btn" href="?modo=participante" target="_blank">PARTICIPANTE</a></div></section><section class="card"><div class="eyebrow">BANCO DE DADOS</div><h2 style="margin:7px 0;font:900 28px Nunito">Módulo isolado</h2><p class="muted tiny">A reunião existente continua usando seus caminhos atuais. Este treinamento grava somente no submódulo <b>${BASE}/...</b>, sem alterar os caminhos atuais da reunião.</p><div id="dbDiag" class="notice">Aguardando conexão...</div><button id="restoreContent" class="btn orange block" style="margin-top:10px">RESTAURAR CONTEÚDO ORIGINAL DESTE TREINAMENTO</button></section></div><div class="adminLayout"><aside class="panel adminSide"><div class="eyebrow">CONTEÚDO</div><h3>Slides</h3><div id="adminSlides" class="adminSlides"></div></aside><section class="panel adminMain"><div id="emptyEditor" class="waiting"><i class="fa-solid fa-pen-ruler"></i><h2>Selecione um slide</h2><p class="muted">Edite texto e perguntas sem mexer no código.</p></div><form id="editorForm" class="hidden"><div class="eyebrow" id="editKicker">EDITAR SLIDE</div><h2 id="editHeading" style="font:900 30px Nunito"></h2><div class="editor"><label class="label">Título<input id="eTitle" class="input"></label><label class="label">Chamada / categoria<input id="eKicker" class="input"></label><label class="label wide">Texto principal<textarea id="eBody" class="input" rows="4"></textarea></label><label id="eAuthorWrap" class="label wide hidden">Nome na identificação da dica (opcional)<input id="eAuthor" class="input" placeholder="Deixe em branco para mostrar somente DICA DA EQUIPE"></label><label class="label wide">Itens / alternativas — uma linha por item<textarea id="eItems" class="input" rows="7"></textarea></label><label class="label">Alternativa correta (A=1, B=2...)<input id="eCorrect" class="input" inputmode="numeric"></label><label class="label">Tipo<input id="eType" class="input" readonly></label><label class="label wide">Explicação da resposta<textarea id="eExplain" class="input" rows="4"></textarea></label></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" type="submit">SALVAR ALTERAÇÕES</button><button id="cancelEdit" class="btn" type="button">CANCELAR</button></div></form></section></div><div class="footer">Powered by <b>thIAguinho Soluções Digitais</b></div></main>`}
let editIndex=-1;async function initAdmin(){if(sessionStorage.getItem('kumonTrainingAdmin')!=='1'){$('#app').innerHTML=adminLogin();$('#adminLogin').onsubmit=e=>{e.preventDefault();if($('#pin').value===ADMIN_PIN){sessionStorage.setItem('kumonTrainingAdmin','1');initAdmin()}else{toast('PIN incorreto.',true);$('#pin').select()}};return}$('#app').innerHTML=adminHtml();await authTry();slides=await getSlides();renderAdminSlides();db.ref('.info/connected').on('value',s=>{const e=$('#aStatus');e.textContent=s.val()?'CONECTADO':'OFFLINE';e.classList.toggle('ok',!!s.val());$('#dbDiag').className='notice '+(s.val()?'good':'warn');$('#dbDiag').textContent=s.val()?'Firebase conectado. Aguardando teste de escrita do módulo.':'Sem conexão com o Firebase.'});db.ref(BASE+'/config/activeSession').on('value',s=>{activeCode=s.val()||'';bindAdminSession();$('#aSession').textContent=activeCode?'Sessão '+activeCode:'Nenhuma sessão ativa'});$('#newSession').onclick=createSession;$('#endSession').onclick=async()=>{if(!activeCode)return;if(confirm('Encerrar a sessão '+activeCode+'?')){await sessionRef(activeCode).child('meta').update({status:'encerrada',endedAt:firebase.database.ServerValue.TIMESTAMP});await db.ref(BASE+'/config/activeSession').remove();toast('Sessão encerrada.')}};$('#restoreContent').onclick=async()=>{if(confirm('Restaurar o conteúdo original deste treinamento? As edições dos slides serão substituídas.')){await db.ref(BASE+'/content').set({slides:DEFAULT_SLIDES,version:1,restoredAt:firebase.database.ServerValue.TIMESTAMP});slides=JSON.parse(JSON.stringify(DEFAULT_SLIDES));renderAdminSlides();toast('Conteúdo original restaurado.')}};$('#editorForm').onsubmit=saveEditor;$('#cancelEdit').onclick=()=>{editIndex=-1;$('#editorForm').classList.add('hidden');$('#emptyEditor').classList.remove('hidden');document.querySelectorAll('#adminSlides button').forEach(b=>b.classList.remove('active'))};try{await db.ref(BASE+'/_diagnostico').set({ts:firebase.database.ServerValue.TIMESTAMP});await db.ref(BASE+'/_diagnostico').remove();$('#dbDiag').className='notice good';$('#dbDiag').textContent='Leitura e escrita confirmadas no módulo de treinamento.'}catch(e){$('#dbDiag').className='notice warn';$('#dbDiag').textContent='O Firebase bloqueou a escrita em '+BASE+'. Se esta mensagem aparecer após esta correção, envie as regras atuais do Realtime Database para eu acrescentar somente este submódulo, sem mexer na reunião.'}}
function renderAdminSlides(){$('#adminSlides').innerHTML=slides.map((s,i)=>`<button data-i="${i}">${String(i+1).padStart(2,'0')} • ${esc(s.title||'Slide')}<div class="tiny muted">${esc(s.type||'content')}</div></button>`).join('');$('#adminSlides').querySelectorAll('button').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.i)))}
function openEditor(i){editIndex=i;const s=slides[i];$('#emptyEditor').classList.add('hidden');$('#editorForm').classList.remove('hidden');$('#editHeading').textContent=s.title||'Slide';$('#eTitle').value=s.title||'';$('#eKicker').value=s.kicker||'';$('#eBody').value=s.body||s.prompt||'';$('#eAuthor').value=s.author||'';$('#eAuthorWrap').classList.toggle('hidden',s.type!=='tip');const arr=s.options||s.bullets||s.items||[];$('#eItems').value=arr.join('\n');$('#eCorrect').value=s.type==='question'&&Number.isInteger(s.correct)?String(s.correct+1):'';$('#eType').value=s.type||'content';$('#eExplain').value=s.explanation||'';document.querySelectorAll('#adminSlides button').forEach((b,n)=>b.classList.toggle('active',n===i))}
async function saveEditor(e){e.preventDefault();if(editIndex<0)return;const s={...slides[editIndex]};s.title=$('#eTitle').value.trim();s.kicker=$('#eKicker').value.trim();if(s.type==='tip')s.author=$('#eAuthor').value.trim();const body=$('#eBody').value.trim();const lines=$('#eItems').value.split('\n').map(x=>x.trim()).filter(Boolean);if(s.type==='question'){s.prompt=body;s.options=lines;s.correct=Math.max(0,Number($('#eCorrect').value||1)-1);s.explanation=$('#eExplain').value.trim()}else if(s.type==='flow'){s.body=body;s.items=lines}else{s.body=body;if(s.bullets)s.bullets=lines}slides[editIndex]=s;try{await db.ref(BASE+'/content').update({slides,updatedAt:firebase.database.ServerValue.TIMESTAMP});toast('Slide salvo.');renderAdminSlides();openEditor(editIndex)}catch(err){toast('Firebase bloqueou a gravação: '+err.message,true)}}
async function createSession(){try{let code='';for(let i=0;i<20;i++){const c=makeCode(),x=await sessionRef(c).once('value');if(!x.exists()){code=c;break}}if(!code)throw new Error('Não foi possível gerar código livre.');await sessionRef(code).set({meta:{title:'Treinamento de Equipe — Organização',status:'ativa',createdAt:firebase.database.ServerValue.TIMESTAMP},state:{currentSlide:0,reveal:false,updatedAt:firebase.database.ServerValue.TIMESTAMP}});await db.ref(BASE+'/config/activeSession').set(code);toast('Sessão '+code+' criada e ativada.')}catch(e){toast('Não foi possível criar a sessão: '+e.message,true)}}
let aBound='';function bindAdminSession(){if(!activeCode){$('#aPeople').textContent='0';$('#aSlide').textContent='—';$('#aAns').textContent='0';return}if(aBound===activeCode)return;aBound=activeCode;sessionRef(activeCode).child('participants').on('value',s=>{$('#aPeople').textContent=s.numChildren()||0});sessionRef(activeCode).child('state').on('value',s=>{const v=s.val()||{};current=Number(v.currentSlide)||0;$('#aSlide').textContent=(current+1)+'/'+slides.length;updateAdminAnswerCount()});sessionRef(activeCode).child('answers').on('value',()=>updateAdminAnswerCount())}
async function updateAdminAnswerCount(){const s=slides[current];let n=0;if(activeCode&&s?.type==='question'){const x=await sessionRef(activeCode).child('answers/'+s.id).once('value');n=x.numChildren()||0}$('#aAns').textContent=n}
async function boot(){try{appInit();if(mode==='apresentacao')await initPresentation();else if(mode==='controle')await initControl();else if(mode==='participante')await initParticipant();else if(mode==='admin')await initAdmin();else renderHome()}catch(e){console.error(e);$('#app').innerHTML=`<main class="shell"><section class="panel hero"><div class="eyebrow">ERRO DE INICIALIZAÇÃO</div><h1>Não foi possível abrir o treinamento</h1><p>${esc(e.message||e)}</p><div class="notice warn" style="margin-top:18px">Confirme que <b>treinamento.html</b> está na raiz do mesmo repositório e que <b>js/firebase-config.js</b> continua no local atual.</div></section></main>`}}
boot();
})();
</script>
