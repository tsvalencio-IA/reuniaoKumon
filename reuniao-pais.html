<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00AEEF">
<title>Reunião de Pais 2026 • Kumon Rio Preto Shopping</title>
<link rel="icon" type="image/svg+xml" href="assets/icon-apresentacao.svg">
<link rel="apple-touch-icon" href="assets/icon-apresentacao-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v2-base.css">
<link rel="stylesheet" href="css/v2-slides.css">
<link rel="stylesheet" href="css/v2-responsive.css">
<link rel="stylesheet" href="css/v2-projector-fix.css">
<style>
.parent-counter{min-width:88px;text-align:center;padding:10px 14px;border:1px solid #31425c;background:#142033;border-radius:14px;font-weight:800;font-size:13px;color:#d9e7f5}
.parent-readonly{position:fixed;left:50%;bottom:calc(clamp(66px,10dvh,94px) + 10px);transform:translateX(-50%);z-index:20;padding:7px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(8,13,23,.72);backdrop-filter:blur(8px);font-size:10px;font-weight:700;color:#8fa6bc;pointer-events:none;white-space:nowrap}
@media(max-width:820px),(orientation:portrait){.parent-readonly{display:none}.parent-counter{min-width:70px;padding:8px 10px;font-size:12px}}
:fullscreen .parent-readonly,:-webkit-full-screen .parent-readonly{display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
<div id="presentation" class="presentation-shell">
  <div id="progress" class="progress"></div>
  <header id="header" class="presentation-header">
    <div id="slideIcon" class="slide-icon"><i class="fa-solid fa-star"></i></div>
    <h1 id="slideTitle">Reunião de Pais 2026</h1>
  </header>
  <main id="stage" class="presentation-stage"><div class="loading">Carregando reunião...</div></main>
  <div class="parent-readonly">Visualização independente • não interfere na apresentação ao vivo</div>
  <footer class="presentation-footer">
    <div class="nav-controls">
      <button id="prev" class="round-btn" aria-label="Voltar"><i class="fa-solid fa-chevron-left"></i></button>
      <button id="home" class="round-btn logo-btn" aria-label="Primeiro slide">K</button>
      <button id="next" class="round-btn" aria-label="Avançar"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="footer-tools">
      <div id="counter" class="parent-counter">1 / 1</div>
      <button id="fullscreen" class="tool-btn" title="Tela cheia" aria-label="Tela cheia"><i class="fa-solid fa-expand"></i></button>
    </div>
    <div class="signature">Reunião de Pais 2026<br>Powered by <b>thIAguinho Soluções Digitais</b></div>
  </footer>
</div>
<script src="js/legacy-parser.js"></script>
<script src="js/v2-renderer.js"></script>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const stage=$('stage'),header=$('header'),titleEl=$('slideTitle'),iconEl=$('slideIcon'),progress=$('progress'),counter=$('counter');
  let db=null,slides=[],media={},links={},current=0,touchX=null;

  function normalise(raw){
    if(!raw)return[];
    if(Array.isArray(raw))return raw.filter(Boolean);
    return Object.keys(raw).sort((a,b)=>Number(a)-Number(b)).map(k=>raw[k]).filter(Boolean);
  }

  function clampIndex(i){
    return Math.max(0,Math.min(Math.max(0,slides.length-1),Number(i)||0));
  }

  function hashIndex(){
    const m=location.hash.match(/(?:^#|&)slide=(\d+)/i);
    return m?Math.max(0,Number(m[1])-1):0;
  }

  function setHash(){
    const h='#slide='+(current+1);
    if(location.hash!==h)history.replaceState(null,'',h);
  }

  function showError(message){
    stage.innerHTML='<div class="error-state"><strong>Não foi possível carregar a reunião.</strong>'+window.KumonRenderer.esc(message)+'</div>';
  }

  async function loadSlides(){
    const snap=await db.ref('kumon_config/presentation/slides').once('value');
    let data=normalise(snap.val());
    if(data.length)return data;
    data=await window.LegacySlidesParser.load();
    if(!data.length)throw new Error('A apresentação não contém slides válidos.');
    return data;
  }

  function render(){
    if(!slides.length)return;
    current=clampIndex(current);
    const s=slides[current];
    window.KumonRenderer.render(stage,header,titleEl,iconEl,s,media,links);
    progress.style.width=((current+1)/slides.length*100)+'%';
    counter.textContent=(current+1)+' / '+slides.length;
    document.title=(s.title||s.t||'Reunião de Pais 2026')+' • Kumon';
    setHash();
  }

  function go(i){
    if(!slides.length)return;
    current=clampIndex(i);
    render();
  }

  async function init(){
    try{
      firebase.initializeApp(window.KUMON_FIREBASE_CONFIG);
      db=firebase.database();

      /* SOMENTE LEITURA:
         não lê nem grava kumon_config/state
         não lê nem grava kumon_config/action
         cada família navega de forma independente. */
      const [settingsSnap,loadedSlides]=await Promise.all([
        db.ref('kumon_config/settings').once('value'),
        loadSlides()
      ]);

      const settings=settingsSnap.val()||{};
      media=settings.media||{};
      links=settings.links||{};
      slides=loadedSlides;
      current=clampIndex(hashIndex());
      render();
    }catch(e){
      console.error(e);
      showError(e.message||String(e));
    }
  }

  $('prev').onclick=()=>go(current-1);
  $('next').onclick=()=>go(current+1);
  $('home').onclick=()=>go(0);

  $('fullscreen').onclick=async()=>{
    try{
      if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){console.warn(e)}
  };

  window.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
    if(['ArrowRight','PageDown','ArrowDown'].includes(e.key)){e.preventDefault();go(current+1)}
    if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){e.preventDefault();go(current-1)}
    if(e.key===' '||e.key==='Enter'){e.preventDefault();window.KumonRenderer.mediaAction(stage)}
    if(e.key.toLowerCase()==='f')$('fullscreen').click();
  });

  window.addEventListener('hashchange',()=>{
    if(!slides.length)return;
    const n=clampIndex(hashIndex());
    if(n!==current){current=n;render()}
  });

  stage.addEventListener('touchstart',e=>{touchX=e.changedTouches[0]?.clientX??null},{passive:true});
  stage.addEventListener('touchend',e=>{
    if(touchX===null)return;
    const dx=(e.changedTouches[0]?.clientX??touchX)-touchX;
    touchX=null;
    if(Math.abs(dx)>70)go(current+(dx<0?1:-1));
  },{passive:true});

  init();
})();
</script>
</body>
</html>
